  .tip{padding:12px 13px;gap:9px;font-size:12px}

  .timer-ring{width:min(72vw,230px);height:min(72vw,230px);margin:18px auto}

  #timer-dock{left:12px;right:12px;bottom:12px;text-align:center}

.card{

  border-radius:14px;

  background:rgba(255,255,255,.96);
  padding:18px;
}

.card.soft{background:#fff4f6}

.card-head{margin-bottom:11px}
.card-head h2,.card-head h3{font-weight:750;color:#6f5260}

.card-head h2{font-size:13px}
.card-head h3{font-size:12px}
.card-actions button{border-radius:8px;color:#cf6a8a}
.grid{gap:14px}.stack>*+*{margin-top:14px}.mt{margin-top:16px}.mb{margin-bottom:16px}

  min-height:128px;
  margin-bottom:14px;
  padding:19px 21px;
  background:
    radial-gradient(circle at 83% 22%,rgba(255,255,255,.67),transparent 12rem),
    linear-gradient(105deg,#ffe8ef 0%,#fff1f4 55%,#fff6f2 100%);
  border-color:#f2ced9;
  overflow:hidden;
}
.hero::before{
  content:"⭐";
  position:absolute;
  right:134px;
  bottom:19px;
  font-size:18px;
  opacity:.74;
  transform:rotate(10deg);
  pointer-events:none;
}
.hero::after{
  content:"🌷  ✨";
  position:absolute;
  right:18px;
  top:14px;
  font-size:18px;
  letter-spacing:4px;
  opacity:.62;
  pointer-events:none;
}
[data-theme=dark] .hero{background:linear-gradient(105deg,#3a1420,#2c1119);border-color:#512131}
.hero>div:first-child{position:relative;z-index:1}
.hero .eyebrow{font-size:8px;color:#ca6e8b;letter-spacing:1.1px;font-weight:800}
.hero h1{
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:21px;
  font-weight:760;
  letter-spacing:-.35px;
  color:#5b3b49;
  margin:5px 0 6px;
}
[data-theme=dark] .hero h1{color:#fff3f7}
.hero p{font-size:11.5px;line-height:1.45;color:#a06e80;max-width:690px;margin-bottom:13px;font-style:italic}
.hero .hero-art{width:105px;height:92px;font-size:0;opacity:1;transform:none}
.hero .hero-art::before{width:82px;height:82px;background:rgba(255,255,255,.72);box-shadow:0 6px 22px rgba(221,117,149,.09)}
.hero .hero-art span{font-size:0}
.hero .hero-art span::after{content:"🌈\A♡";white-space:pre;font-size:34px;line-height:.8;text-align:center;display:block;filter:saturate(.75)}

[data-theme=dark] .hero-time{background:#32141e}

.one-thing{
  position:relative;
  margin-bottom:0;
  padding:15px 18px;
  border-color:#f2d4de;
  background:#fff;
  box-shadow:0 5px 18px rgba(206,106,139,.045);
}
[data-theme=dark] .one-thing{background:var(--surface);border-color:var(--border)}
.one-thing::after{content:"♡";position:absolute;right:13px;top:9px;color:#f2a7bc;opacity:.75;pointer-events:none}
.one-icon{background:#fff0f6;border-color:#f3cedb;border-radius:10px;padding:8px;font-size:18px}
.one-thing label{font-size:8.5px;color:#d16789;letter-spacing:1.1px}
.one-thing input{font-size:14px;color:#71515f}

/* Reference-style stat tiles. */
.metrics{gap:9px;margin:13px 0 15px}
.metrics.six{gap:9px}
.metric{
  min-height:84px;
  padding:12px 11px;
  text-align:center;
  border-color:#f1dfe5;
  border-radius:12px;
  background:#fff;
  box-shadow:0 4px 14px rgba(207,102,135,.04);
}
[data-theme=dark] .metric{background:var(--surface);border-color:var(--border)}
.metric-icon{font-size:16px;margin-bottom:6px}
.metric-value{font-size:20px;color:#ed5b8c;letter-spacing:-.5px;font-weight:760}
.metric-label{font-size:7.6px;letter-spacing:.55px;margin-top:6px;color:#ba7c90;font-weight:750}
.metric:nth-child(2) .metric-value{color:#e36c98}
.metric:nth-child(3) .metric-value{color:#d59a26}
.metric:nth-child(4) .metric-value{color:#ee6c85}
.metric:nth-child(5) .metric-value{color:#6d93bf}
.metric:nth-child(6) .metric-value{color:#d87693}

.dashboard-grid{gap:13px}.dashboard-column{gap:13px}
.dashboard-grid .card{position:relative;overflow:hidden}
.dashboard-grid .card::after{pointer-events:none;position:absolute;right:12px;bottom:8px;font-size:17px;opacity:.12;transform:rotate(-8deg)}
[data-dashboard-card="priorities"]::after{content:"🎯"}
[data-dashboard-card="energy"]::after{content:"⚡"}
[data-dashboard-card="mood"]::after{content:"🎀"}
[data-dashboard-card="habits"]::after{content:"🌱"}
[data-dashboard-card="body"]::after{content:"🫧"}
[data-dashboard-card="schedule"]::after{content:"☕"}
[data-dashboard-card="bills"]::after{content:"🌼"}
[data-dashboard-card="project"]::after{content:"✨"}
[data-dashboard-card="assignment"]::after{content:"📝"}
[data-dashboard-card="expenses"]::after{content:"💗"}
[data-dashboard-card="meals"]::after{content:"🍓"}
[data-dashboard-card="cleaning"]::after{content:"🧸"}
[data-dashboard-card="brain"]::after{content:"☁️"}

/* Forms are blush-tinted in the reference screens. */
input,select,textarea{
  border-color:#f0d8e0;
  border-radius:8px;
  background:#fff7f8;
  color:#5e4751;
  min-height:39px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}
input::placeholder,textarea::placeholder{color:#c59cab;opacity:.9}
input:focus,select:focus,textarea:focus{border-color:#ee8bac;background:#fff;outline-color:#f4aac1}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{background:#35151f;border-color:#542333;color:var(--text);box-shadow:none}
button{
  border-color:#eed9e0;
  border-radius:9px;
  background:#fff;
  color:#725461;
  min-height:38px;
}
button:hover{border-color:#eda4bb;background:#fff4f7}
button.primary{
  background:linear-gradient(180deg,#f46b9b,#ed5b8d);
  border-color:#eb5a8b;
  color:white;
  box-shadow:0 4px 10px rgba(239,93,143,.13);
}
button.primary:hover{background:linear-gradient(180deg,#ec5a8e,#dc477b)}
[data-theme=dark] button{background:#32141e;border-color:#522231;color:var(--text)}

[data-theme=dark] button.primary{color:white;background:#ef5d8f;border-color:#ef5d8f}
button.selected,.chip.selected{background:#ffe8f0;border-color:#ef8cab;color:#cf4c78}

.chip{background:#fff8fa;border-color:#f0dce3;font-size:10.5px}
.badge{background:#fff0f4;color:#ad6d82;border:1px solid #f5dde5}

.quick-entry{background:#fff1f4;border-color:#f0d4dd;padding:15px}
[data-theme=dark] .quick-entry{background:var(--soft);border-color:var(--border)}

.record{border-color:#f1dfe5;border-radius:11px;background:#fff;padding:14px 16px}
[data-theme=dark] .record{background:var(--surface);border-color:var(--border)}
.line-item{border-bottom-color:#f5e6ea;padding:9px 0}
[data-theme=dark] .line-item{border-bottom-color:var(--border)}
.step-number{background:#fff1f4;border:1px solid #f2d7df;color:#d26a89;width:26px;height:26px}
.habit-dot{background:#fff9fa;border-color:#eddbe2}
.progress{height:6px;background:#f5e4e9}
.progress span{background:linear-gradient(90deg,#f48eae,#ef5d8f)}
.progress.success span{background:#71bb86}.progress.warning span{background:#efbd4d}.progress.danger span{background:#ef7585}
.bar{background:#ffe1eb;border-color:#f4cad8}.bar.highlight{background:#ef7da3;border-color:#ef7da3}
.calendar-label{background:#fff1f5;color:#b46f85;border-color:#f0dce3}
.day-card,.calendar .day-card{border-color:#f0dce3}.day-card.today{border-color:#ef7ea3;box-shadow:0 0 0 2px rgba(239,126,163,.07)}
.mini-event,.time-event{background:#ffeef3;border-left-color:#ef6c99;color:#7d5263}
.timer-ring{background:conic-gradient(#f16596 var(--timer-progress,0%),#ffe8ef 0);box-shadow:0 7px 25px rgba(239,93,143,.10)}
.presence{background:#fff2f5;border:1px solid #f2d9e1}.breath{background:#fff1f5;border-color:#ef94b1}
[data-theme=dark] .presence{background:var(--soft);border-color:var(--border)}

.tip{background:#fff5f6;border-color:#f0d8e0}
.info-box{border:1px solid #dcebf6}.warning-box{border:1px solid #f2e3b5}
.sample-banner{background:#fff0f4;color:#b96782;border-bottom-color:#f2d9e1}

/* Cozy tiny sticker treatment for special empty states without changing content. */
.empty{position:relative;border-radius:11px}
.empty::after{content:"✿";display:inline-block;margin-left:6px;color:#ed9cb5;opacity:.55;transform:rotate(12deg)}

/* Dialogs carry the same paper-card language. */
dialog{border-color:#f1dce3;border-radius:16px;box-shadow:0 26px 90px rgba(92,42,61,.22)}
dialog::backdrop{background:rgba(72,39,53,.35);backdrop-filter:blur(5px)}
.modal-head{background:#fff6f8;border-bottom-color:#f0dce3}
.modal-foot{background:#fffaf9;border-top-color:#f0dce3}
[data-theme=dark] .modal-head,[data-theme=dark] .modal-foot{background:var(--surface);border-color:var(--border)}

#toast{border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 28px rgba(82,36,55,.22)}
#timer-dock{border-color:#ef9bb6;box-shadow:0 8px 24px rgba(203,90,127,.13)}

/* The reference's dark mode is deep burgundy, not neutral gray. */
[data-theme=dark] .nav-item{color:#d6a9b8}
[data-theme=dark] .nav-item:hover{background:#34141e;border-color:#4f2130}
[data-theme=dark] .nav-item.active{background:#431625;color:#ff91b5;border-color:#61263b}
[data-theme=dark] .nav-item .nav-icon{background:#32131d;box-shadow:inset 0 0 0 1px #4d1f2e}
[data-theme=dark] .metric-value{color:#ff84ad}
[data-theme=dark] .page-head p,[data-theme=dark] .hero p{color:#c99cad}

/* Keep the visual style on phones while preserving the existing mobile logic. */
@media(max-width:820px){
  :root{--nav-width:70px}
  main{padding:20px}
  #topbar{padding-left:20px;padding-right:20px}
}
@media(max-width:600px){
  body{background:var(--page)}
  #topbar{background:rgba(255,251,249,.96)}
  [data-theme=dark] #topbar{background:rgba(28,12,18,.96)}
  main{padding:13px 10px 30px}
  .page-head{padding:13px 14px;margin-bottom:11px;border-radius:13px}
  .page-head::before{right:9px;top:5px;font-size:8px;letter-spacing:3px}
  .page-head h1{font-size:20px}
  .page-head p{font-size:11px;padding-right:6px}
  .hero{padding:16px 15px;border-radius:14px}
  .hero::after{right:8px;top:8px;font-size:13px}
  .hero::before{display:none}
  .hero h1{font-size:20px}
  .hero p{font-size:11.5px}
  .card{padding:14px;border-radius:13px}
  .metrics,.metrics.six{gap:8px;margin:11px -4px 13px;padding:0 4px 5px}
  .metric{flex-basis:128px;min-height:83px}
  .metric-value{font-size:19px}
  .one-thing{padding:13px}
  .brand::after{display:none}
}

@media print{
  body{background:white!important}
  .page-head,.hero{background:white!important}
  .page-head::before,.hero::before,.hero::after,.dashboard-grid .card::after,.empty::after{display:none!important}
}
</style>

function currentBill(r,reference=today()){let due=r.due;let guard=0;while(due&&(r.payments||[]).some(p=>p.date===due)&&due<reference&&guard++<1000){let next=nextDate(due,r.frequency,r.interval);if(!next)break;if(['Monthly','Quarterly','Yearly'].includes(r.frequency)){const n=parseDate(next),anchor=Number(r.dueDay)||parseDate(r.due).getDate();n.setDate(Math.min(anchor,new Date(n.getFullYear(),n.getMonth()+1,0).getDate()));next=localDate(n)}due=next}const paid=(r.payments||[]).some(p=>p.date===due);return {...r,due,paid,completed:paid}}

async function finishFocus(auto=false){if(completingFocus)return;const t=focusTimer();if(t.status==='idle')return toast('Start a session first.');completingFocus=true;try{await flushSaves();const elapsed=auto?t.totalMs:Math.max(0,t.totalMs-remaining(t));const task=get('tasks',t.taskId);const ops=[{s:'settings',r:{...t,status:'idle',remainingMs:t.totalMs,runId:null,startedAt:null,date:null}}];if(elapsed>0)ops.push({s:'focusSessions',r:{id:'focus_'+t.runId,title:t.title||task?.title||'Focused time',taskId:t.taskId||'',projectId:task?.projectId||'',sample:!!task?.sample,date:t.date||today(),startTime:new Date(t.startedAt||isoNow()).toTimeString().slice(0,5),minutes:Math.round(elapsed/6000)/10,kind:t.kind,finishedAt:isoNow(),completion:auto?'Timer completed':'Finished early'}});await commit(ops,{label:t.kind==='Break'?'Break complete.':'Session saved. Take a moment to reset.'});render()}finally{completingFocus=false}}

function validateBackup(b){if(!b||b.format!=='LifePlannerBackup'||b.schemaVersion!==1||typeof b.appVersion!=='string'||!Number.isFinite(Date.parse(b.exportedAt)))throw Error('This is not a supported LifePlannerBackup (schema version 1).');if(!b.data||typeof b.data!=='object'||Array.isArray(b.data))throw Error('Backup data is missing.');const keys=Object.keys(b.data);if(keys.length!==STORES.length||STORES.some(s=>!keys.includes(s)))throw Error('The backup must contain every planner store.');let count=0;const safe=(v,depth=0)=>{if(depth>12)throw Error('Data nesting is too deep.');if(typeof v==='number'&&!Number.isFinite(v))throw Error('Invalid numeric value.');if(typeof v==='string'&&v.length>2000000)throw Error('An entry is too large.');if(v&&typeof v==='object'){for(const k of Object.keys(v)){if(['__proto__','prototype','constructor'].includes(k))throw Error('Unsafe data key.');safe(v[k],depth+1)}}};safe(b);for(const s of STORES){if(!Array.isArray(b.data[s]))throw Error('Invalid store: '+s);const ids=new Set();count+=b.data[s].length;if(count>350000)throw Error('Backup contains too many records.');for(const r of b.data[s]){if(!r||Array.isArray(r)||typeof r!=='object'||typeof r.id!=='string'||!/^[a-zA-Z0-9_.:@-]{1,160}$/.test(r.id)||ids.has(r.id))throw Error('Invalid or duplicate ID in '+s);ids.add(r.id);if(typeof r.archived!=='boolean'||!Number.isFinite(Date.parse(r.createdAt))||!Number.isFinite(Date.parse(r.updatedAt)))throw Error('Invalid record metadata in '+s);for(const f of SCHEMA[s]||[]){const v=r[f.key];if(v===undefined||v===null||v==='')continue;if(['number','money'].includes(f.type)){if(typeof v!=='number'||!Number.isFinite(v)||Math.abs(v)>9e12||(f.min!==undefined&&v<f.min)||(f.max!==undefined&&v>f.max))throw Error('Invalid '+f.label+' in '+s);if(f.type==='money'&&!Number.isSafeInteger(v))throw Error('Money must use integer minor units.')}else if(f.type==='checkbox'&&typeof v!=='boolean')throw Error('Invalid checkbox in '+s);else if(f.type==='weekdays'&&(!Array.isArray(v)||!v.every(d=>['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].includes(d))))throw Error('Invalid weekdays.');else if(f.type==='date'&&!validDate(v))throw Error('Invalid date in '+s);else if(!['checkbox','weekdays'].includes(f.type)&&typeof v!=='string')throw Error('Invalid text field in '+s)}if(r.moneyScale!==undefined&&(!Number.isInteger(r.moneyScale)||r.moneyScale<0||r.moneyScale>3))throw Error('Invalid money precision.');for(const k of ['completed','sample','done','checked'])if(r[k]!==undefined&&typeof r[k]!=='boolean')throw Error('Invalid status value.');for(const k of ['date','due','expiry'])if(r[k]!==undefined&&r[k]!==null&&r[k]!==''&&!validDate(r[k]))throw Error('Invalid date in '+s);if(s==='habits'&&r.target!==undefined&&(!Number.isInteger(r.target)||r.target<1))throw Error('Habit targets must be positive whole numbers.');if(s==='habitLogs'&&(!validDate(r.date)||typeof r.habitId!=='string'||!Number.isInteger(r.count)||r.count<0))throw Error('Invalid habit log.');if(r.payments!==undefined&&(!Array.isArray(r.payments)||r.payments.some(p=>!validDate(p.date)||!Number.isSafeInteger(p.amount)||p.amount<0)))throw Error('Invalid payment history.');if(r.checks!==undefined&&(!Array.isArray(r.checks)||r.checks.some(c=>typeof c.title!=='string'||typeof c.done!=='boolean')))throw Error('Invalid checklist.');if(s==='dailyCheckins'){for(const k of ['moods','priorities','moodHistory','energyHistory'])if(r[k]!==undefined&&!Array.isArray(r[k]))throw Error('Invalid daily check-in.');if(r.moods&&!r.moods.every(m=>typeof m==='string'))throw Error('Invalid mood list.');}if(s==='groceryLists'&&r.items!==undefined&&!Array.isArray(r.items))throw Error('Invalid grocery template.')}}const p=b.data.settings.find(r=>r.id==='preferences');if(p){for(const k of Object.keys(DEFAULTS)){if(p[k]===undefined)continue;if(typeof DEFAULTS[k]==='boolean'&&typeof p[k]!=='boolean')throw Error('Invalid setting '+k);if(Array.isArray(DEFAULTS[k])&&(!Array.isArray(p[k])||!p[k].every(v=>typeof v==='string')))throw Error('Invalid setting '+k);if(typeof DEFAULTS[k]==='string'&&typeof p[k]!=='string')throw Error('Invalid setting '+k)}if(p.currency&&!['USD','GBP','EUR','CAD','AUD','PKR','INR','JPY','Other'].includes(p.currency))throw Error('Invalid currency.');if(p.theme&&!['light','dark'].includes(p.theme))throw Error('Invalid theme.');if(p.waterTarget!==undefined&&(!Number.isInteger(p.waterTarget)||p.waterTarget<1||p.waterTarget>50))throw Error('Invalid water target.')}for(const t of b.data.settings.filter(r=>['focusTimer','declutterTimer'].includes(r.id))){if(t.endsAt!==undefined&&!Number.isFinite(t.endsAt))throw Error('Invalid timer timestamp.');if(t.totalMs!==undefined&&(!Number.isFinite(t.totalMs)||t.totalMs<0||t.totalMs>480*60000))throw Error('Invalid timer duration.')}validateRecordShapes(b);return{records:count,stores:STORES.length,exportedAt:b.exportedAt,appVersion:b.appVersion}}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled||el.tagName==='INPUT')return;const fn=ACTIONS[el.dataset.action];if(!fn)return;if(el.dataset.action!=='submit')e.preventDefault();try{el.disabled=true;if(saveTimers.size)await flushSaves();await fn(el)}catch(err){console.error(err);toast('Could not complete that action: '+err.message)}finally{el.disabled=false}});
document.addEventListener('submit',async e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();try{const fd=new FormData(form);switch(form.dataset.form){case 'record':return await saveRecord(form);case 'custom':{const fn=modalHandlers.get(form.dataset.handler);if(!fn)return;await fn(fd);modalHandlers.delete(form.dataset.handler);$('#modal').close();break}case 'quick':{const s=form.dataset.store,titleText=String(fd.get('title')||'').trim();if(!titleText)return;await put(s,{title:titleText,...(s==='tasks'?{energy:'Low',priority:'Normal',recurring:'None',completed:false,order:data.tasks.length}:{}),...(s==='groceryItems'?{quantity:1,checked:false}:{})},{label:'Added. One less thing to remember.',undo:true});form.reset();render();if(s==='tasks')$('#quick-task')?.focus();break}case 'brain':case 'distraction':{const text=String(fd.get('title')||'').trim();if(!text)return;await put('brainDump',{title:text.slice(0,500),body:text.length>500?text:'',source:form.dataset.form==='distraction'?'Focus':'Brain Dump'},{label:'Thought parked',undo:true});form.reset();if(form.dataset.form==='brain')render();break}case 'custom-focus':await setFocusPreset(Number(fd.get('minutes')));break;case 'onboarding':{const p={name:fd.get('name').trim(),weekStart:fd.get('weekStart'),currency:fd.get('currency'),theme:fd.get('theme'),simple:fd.get('mode')==='Simple Mode',onboarded:true,startedAt:isoNow()};await savePrefs(p);$('#modal').close();if(e.submitter?.value==='sample')await sampleData();render();break}case 'preferences':{const keys=['name','workName','weekStart','timeFormat','dateFormat','message'],p=Object.fromEntries(keys.map(k=>[k,fd.get(k)]));for(const k of ['waterEnabled','sleepFlags','supportive'])p[k]=fd.has(k);p.waterTarget=Number(fd.get('waterTarget'));if(!Number.isInteger(p.waterTarget)||p.waterTarget<1||p.waterTarget>50)throw Error('Choose a target between 1 and 50.');await savePrefs(p,{label:'Preferences saved'});render();break}case 'currency':{const code=String(fd.get('customCurrency')||'XXX').toUpperCase();if(!/^[A-Z]{3}$/.test(code))throw Error('Custom currency code must have three letters.');await savePrefs({currency:fd.get('currency'),customCurrency:code,customSymbol:fd.get('customSymbol'),customDecimals:Number(fd.get('customDecimals'))},{label:'Currency display updated. Historical values were not converted.'});render();break}case 'backup-prefs':await savePrefs({backupReminder:fd.has('backupReminder'),backupDays:Number(fd.get('backupDays'))},{label:'Backup preferences saved'});break;case 'category':{const titleText=fd.get('title').trim();if(!categoryOptions().some(c=>c.toLowerCase()===titleText.toLowerCase()))await put('categories',{title:titleText});render();break}}}catch(err){if($('#form-error'))$('#form-error').textContent=err.message;else toast(err.message)}});

});
document.addEventListener('change',async e=>{const el=e.target;try{if(el.id==='restore-file'){if(el.files[0])await readRestore(el.files[0]);return}if(el.id==='list-sort'){listSort=el.value;render();return}if(el.id==='list-category'){listFilter=el.value;pageIndex=0;render();return}if(el.id==='view-date'){await flushSaves();viewDate=el.type==='month'?el.value+'-01':el.value;render();return}if(el.id==='debt-strategy'){await savePrefs({debtStrategy:el.value});render();return}if(el.id==='focus-task'||el.id==='focus-description'){const t=focusTimer();if(t.status!=='idle'){toast('Finish or reset this session before changing what it is linked to.');render();return}await put('settings',{...t,taskId:$('#focus-task')?$('#focus-task').value:t.taskId,title:$('#focus-description')?.value||get('tasks',$('#focus-task')?.value)?.title||''},{quiet:true});return}if(el.id==='field-recipeId'&&el.value){const r=get('recipes',el.value);if(r&&$('#field-title'))$('#field-title').value=r.title;return}if(el.id==='recipe-meal-type'||el.id==='recipe-prep'){recipeFilters={type:$('#recipe-meal-type').value,prep:$('#recipe-prep').value};render();$('#recipe-meal-type').value=recipeFilters.type;$('#recipe-prep').value=recipeFilters.prep;return}
switch(el.dataset.action){case 'step':{const s=el.dataset.store,r=get(s,el.dataset.id);await put(s,{...r,done:el.checked},{label:'Step updated',undo:true});render();break}case 'deep-step':{const r=get('deepCleaningZones',el.dataset.id),checks=structuredClone(r.checks||[]);checks[Number(el.dataset.index)].done=el.checked;await put('deepCleaningZones',{...r,checks},{label:'Checklist updated',undo:true});render();break}case 'setting-check':await savePrefs({[el.dataset.key]:el.checked});render();break;case 'dashboard-visible':{const id=el.dataset.id;await savePrefs({hiddenCards:el.checked?prefs.hiddenCards.filter(x=>x!==id):[...new Set([...prefs.hiddenCards,id])]});if(moduleId==='dashboard')render();break}case 'nav-visible':{const id=el.dataset.id;await savePrefs({hiddenNav:el.checked?prefs.hiddenNav.filter(x=>x!==id):[...new Set([...prefs.hiddenNav,id])]});break}}
}catch(err){toast(err.message)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchDialog()}});
window.addEventListener('beforeunload',e=>{if(saveTimers.size){flushSaves();e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSaves().catch(()=>{})});
const RENDERERS={dashboard,tasks:taskView,focus:focusView,schedule:scheduleView,brain:brainView,habits:habitsView,dopamine:dopamineView,overwhelm:overwhelmView,weekly:weeklyView,monthly:monthlyView,work:workView,deadlines:deadlinesView,classes:classesView,journal:journalView,meds:medicationView,sleep:sleepView,grades:gradesView,declutter:declutterView,meals:mealsView,mealMonth:mealMonthView,recipes:recipesView,favorites:recipesView,groceries:groceriesView,finance:financeView,bills:billsView,budget:budgetView,debts:debtsView,insights:insightsView,settings:settingsView};
async function boot(){try{if(!window.indexedDB)throw Error('This browser does not allow IndexedDB here. Open the downloaded file in a browser that supports local-file storage.');await openDatabase();await loadData();if(!prefs.startedAt)await savePrefs({startedAt:isoNow()});applyAppearance();renderNav();renderTopbar();viewDate=today();render();if(!prefs.onboarded)onboarding();if('BroadcastChannel'in window){broadcast=new BroadcastChannel('petal-life-planner');broadcast.onmessage=async e=>{if(!Array.isArray(e.data)||!e.data.every(s=>STORES.includes(s)))return;if(saveTimers.size||$('#modal').open)return;await loadData(e.data);applyAppearance();renderNav();renderTopbar();render()}}setInterval(tickTimers,1000);let last=today();setInterval(()=>{if(today()!==last){last=today();viewDate=last;renderTopbar();render()}},30000)}catch(e){console.error(e);$('#main').innerHTML=`<div class="loading"><span class="brand-flower">✳</span><h1>Let’s protect your plans.</h1><p>This browser could not open local storage.</p><p class="muted">${esc(e.message)}</p><p>Open this downloaded HTML in a browser that permits IndexedDB.<br>Private browsing and file preview apps may not support reliable saving.</p><button onclick="location.reload()">Try again</button></div>`}}
boot();
</script>
